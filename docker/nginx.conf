server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Kubernetes ingress strips the `/e2e-lane-enterprise` prefix before
    # traffic reaches this pod, so nginx sees root-relative paths here
    # (`/`, `/main-*.js`, `/habits`, `/api/habits`, ...).

    # Proxy REST calls to the NestJS backend running in the same pod.
    # No trailing slash / path on proxy_pass → the original URI (`/api/habits`)
    # is forwarded unchanged, matching the backend's global `api` prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: Angular deep links (e.g. /habits, /about) must serve
    # index.html so the client router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
