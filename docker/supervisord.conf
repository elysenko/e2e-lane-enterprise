; Runs the NestJS backend and nginx together in one container
; (serve_topology: nginx_frontend_plus_backend_supervisor).
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:backend]
directory=/app/backend
; Apply pending migrations, then boot the API. Prisma seeds example habits
; on first start via HabitsService.onModuleInit, so /habits is never empty.
command=sh -c "npx prisma migrate deploy && node dist/main.js"
environment=PORT="3000",NODE_ENV="production"
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
