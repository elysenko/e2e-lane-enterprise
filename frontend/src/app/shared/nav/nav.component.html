<!-- Desktop top bar -->
<header class="topbar">
  <a class="brand" routerLink="/habits">
    <span class="brand__mark" aria-hidden="true">✓</span>
    <span class="brand__name">Habit Tracker</span>
  </a>

  <nav class="topbar__links" aria-label="Primary">
    <a routerLink="/habits" routerLinkActive="is-active">Habits</a>
    <a routerLink="/about" routerLinkActive="is-active">About</a>
  </nav>
</header>

<!-- Mobile bottom tab bar -->
<nav class="tabbar" aria-label="Primary mobile">
  <a class="tabbar__item" routerLink="/habits" routerLinkActive="is-active">
    <span class="tabbar__icon" aria-hidden="true">🔥</span>
    <span class="tabbar__label">Habits</span>
  </a>
  <a class="tabbar__item" routerLink="/about" routerLinkActive="is-active">
    <span class="tabbar__icon" aria-hidden="true">ℹ️</span>
    <span class="tabbar__label">About</span>
  </a>
</nav>
