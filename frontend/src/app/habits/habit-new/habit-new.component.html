<app-nav />

<main class="page" data-testid="habit-new-main">
  <a class="back" routerLink="/habits">‹ Back to habits</a>
  <h1>Add a habit</h1>
  <p class="page__sub">Give your new habit a clear, simple name.</p>

  <form class="card" (ngSubmit)="create()">
    @if (error(); as e) {
      <p class="form-error" role="alert">{{ e }}</p>
    }

    <div class="field">
      <label for="habit-name">Name</label>
      <input
        id="habit-name"
        data-testid="habit-name-input"
        name="name"
        type="text"
        required
        placeholder="e.g. Meditate for 10 minutes"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
      />
    </div>

    <div class="actions">
      <a class="btn btn--ghost" routerLink="/habits">Cancel</a>
      <!-- Disabled while POST /api/habits is in flight so a double-click cannot
           create the habit twice. The label stays "Create" throughout — the
           accessible name is a stable selector for the acceptance gate. -->
      <button
        type="submit"
        class="btn"
        data-testid="habit-create"
        [disabled]="submitting()"
        [attr.aria-busy]="submitting() ? 'true' : null"
      >
        Create
      </button>
    </div>
  </form>
</main>
